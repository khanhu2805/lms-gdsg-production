name: Deploy LMS

on:
  push:
    branches:
      - main

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql://lms:build-only@localhost:5432/lms_gdsg?schema=public
      DIRECT_URL: postgresql://lms:build-only@localhost:5432/lms_gdsg?schema=public
      BETTER_AUTH_SECRET: build-only-secret-with-more-than-32-characters
      GOOGLE_CLIENT_ID: build-only-client-id
      GOOGLE_CLIENT_SECRET: build-only-client-secret
      OAUTH_TOKEN_ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate
        run: npm run db:generate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

  deploy:
    needs: check
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Deploy
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" << 'EOF'
            set -e

            cd /opt/lms-gdsg

            echo "=== Download source ==="
            git fetch origin main
            git reset --hard origin/main

            echo "=== Build ==="
            docker compose build

            echo "=== Database migration ==="
            docker compose run --rm migrate

            echo "=== Update application ==="
            docker compose up -d

            echo "=== Cleanup ==="
            docker image prune -f

            echo "=== Status ==="
            docker compose ps
          EOF