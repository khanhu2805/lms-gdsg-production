limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=connections_per_ip:10m;

upstream lms_app {
    server app:3000;
    keepalive 64;
}

server {
    listen 8080;
    server_name lms.giaoducsaigon.edu.vn;
    server_tokens off;
    client_max_body_size 8g;

    location /protected/ {
        internal;
        alias /data/lms/;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "private, no-store" always;
        types {
            application/vnd.apple.mpegurl m3u8;
            video/mp2t ts;
            video/mp4 mp4;
            application/pdf pdf;
            text/csv csv;
        }
        default_type application/octet-stream;
    }

    location /api/ {
        limit_req zone=api_per_ip burst=60 nodelay;
        limit_conn connections_per_ip 30;
        proxy_pass http://lms_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;
        proxy_request_buffering off;
    }

    location / {
        limit_conn connections_per_ip 30;
        proxy_pass http://lms_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;
    }

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
}

server {
    listen 8443 ssl;
    server_name lms.giaoducsaigon.edu.vn;

    ssl_certificate /etc/letsencrypt/live/lms.giaoducsaigon.edu.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lms.giaoducsaigon.edu.vn/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 0;

    location / {
        proxy_pass http://app:3000;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /protected/ {
        internal;
        alias /data/lms/;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "private, no-store" always;
        types {
            application/vnd.apple.mpegurl m3u8;
            video/mp2t ts;
            video/mp4 mp4;
            application/pdf pdf;
            text/csv csv;
        }
        default_type application/octet-stream;
    }

    location /api/ {
        limit_req zone=api_per_ip burst=60 nodelay;
        limit_conn connections_per_ip 30;
        proxy_pass http://lms_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;
        proxy_request_buffering off;
    }
}